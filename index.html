<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>My calculator project</h1>

        <div class="calculator-container">

            <div class="display">
                27272727
            </div>

            <div class="btns-container">

                <div class="numberbtn-container">
                    <button class="numbtn">1</button>
                    <button class="numbtn">2</button>
                    <button class="numbtn">3</button>
                    <button class="numbtn">4</button>
                    <button class="numbtn">5</button>
                    <button class="numbtn">6</button>
                    <button class="numbtn">7</button>
                    <button class="numbtn">8</button>
                    <button class="numbtn">9</button>                  
                    <button class="clearbtn numbtn">C</button>
                    <button class="numbtn">0</button>
                    <button class="numbtn">.</button>
                </div>

                <div class="operator-btn">
                    <button class="plus operator">+</button>
                    <button class="subtract operator">-</button>
                    <button class="multiply operator">*</button>
                    <button class="divide operator">/</button>
                    <button class="equality operator">=</button>
                </div> 
            </div>
        </div>
    </body>
</html>
