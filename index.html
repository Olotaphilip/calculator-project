<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>My calculator project</h1>

        <div class="calculator-container">

            <div class="display">
               <div class="expression-display">

               </div>
               <div class="answer-display">

               </div> 
            </div>

            <div class="btns-container">

                <div class="numberbtn-container">
                    <button class="numbtn one">1</button>
                    <button class="numbtn two">2</button>
                    <button class="numbtn three">3</button>
                    <button class="numbtn four">4</button>
                    <button class="numbtn five">5</button>
                    <button class="numbtn six">6</button>
                    <button class="numbtn seven">7</button>
                    <button class="numbtn eigth">8</button>
                    <button class="numbtn nine">9</button>                  
                    <button class="clearbtn numbtn">Cl</button>
                    <button class="numbtn zero">0</button>
                    <button class="numbtn dotbtn">.</button>
                </div>

                <div class="operator-btn">
                    <button class="cancel operator">CE</button>
                    <button class="plus operator">+</button>
                    <button class="subtract operator">-</button>
                    <button class="multiply operator">*</button>
                    <button class="divide operator">/</button>
                    <button class="equality operator">=</button>
                </div> 
            </div>
        </div>
    </body>
</html>
